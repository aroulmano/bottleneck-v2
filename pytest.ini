[pytest]
testpaths = tests
python_files = test_*.py

# Le warning openpyxl « Unknown extension is not supported and will be removed » provient des
# fichiers Excel sources eux-mêmes : ils contiennent un élément d'extension propriétaire — écrit
# par WordPress ou par l'ERP — qu'openpyxl ne sait pas interpréter et qu'il ignore à la lecture.
# Il n'affecte aucune donnée lue, et se répète à chaque ouverture de fichier, ce qui noie la
# sortie de test sous six lignes de bruit.
#
# Il est filtré nommément plutôt que par un `-W ignore` global : masquer tous les avertissements
# reviendrait à masquer aussi ceux qui signalent un vrai problème.
filterwarnings =
    ignore:Unknown extension is not supported and will be removed:UserWarning:openpyxl.*

addopts = -q
